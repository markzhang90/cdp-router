# Merge these settings into the normal service config; this is not a complete config.
# Upgrade all server/worker instances and run migrations before enabling Pull.
[server]
pull_worker_concurrency = 2

[providers.mobile_client]
code = mobile_client
interaction_mode = pull
supported_devices = mobile,web
device_channels = {"mobile":["doubao","qianwen"],"web":["doubao","qianwen"]}
# Set a unique provider token through your local secret configuration.
token =
qps_limit = 10
concurrency_limit = 10
pull_max_items = 1000
pull_max_body_bytes = 8388608
daily_question_quota = 0
enabled = false
# Add mobile_client to the upstream user's dispatch profile before use.
# Omitted interaction_mode/supported_devices retain push/web defaults.
