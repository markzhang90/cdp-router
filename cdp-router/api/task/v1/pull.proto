syntax = "proto3";
package api.task.v1;
import "google/api/annotations.proto";
import "api/task/v1/task.proto";
option go_package = "github.com/GitMarkZhang/cdp-router/api/task/v1;taskv1";
service PullAPI {
 rpc GetPullTask(PullTaskRequest) returns (PullTaskResponse) { option (google.api.http) = {post:"/external/gettask" body:"*"}; }
 rpc SubmitPullResult(PullResultRequest) returns (PullResultResponse) { option (google.api.http) = {post:"/external/taskresult" body:"*"}; }
 rpc GetTaskProgress(GetTaskRequest) returns (TaskProgressResponse) { option (google.api.http) = {get:"/api/v1/tasks/{id}/progress"}; }
 rpc GetExternalTaskProgress(GetExternalTaskRequest) returns (TaskProgressResponse) { option (google.api.http) = {get:"/api/v1/external-tasks/{external_batch_id}/progress"}; }
}
message PullTaskRequest { string request_id=1; string device=2; string channel=3; int32 limit=4; }
message PullTaskResponse { int32 status=1; string message=2; PullTaskData data=3; }
message PullTaskData { string batch_no=1; int64 shard_id=2; string device=3; string channel=4; repeated TaskItem items=5; }
message PullResultRequest { string request_id=1; string batch_no=2; int64 shard_id=3; string schema_version=4; bool finished=5; repeated PullAnswer results=6; }
message PullAnswer {
 // Complete ordered snapshot; omitted/empty clears previous cards. Maximum 100.
 repeated ProductCard product_cards=13 [json_name="productCards"];
 string item_id=1; int32 answer_seq=2; string execution_status=3; string error_code=4; string error_message=5;
 string answer_text=6; string thinking_process=7; string generated_at=8;
 repeated string recommended_questions=9; repeated PullReference references=10;
 string device_id=11; string recording_url=12;
}
message PullResultResponse { int32 status=1; string message=2; PullResultData data=3; }
message PullResultData { int64 submission_id=1; bool accepted=2; }
message TaskProgressResponse { int32 status=1; string message=2; TaskProgressData data=3; }
message TaskProgressData {
 int64 task_id=1; string device=2; string execution_mode=3; string status=4;
 int32 total=5; int32 completed=6; int32 success=7; int32 failed=8;
 int32 unclaimed=9; int32 shards=10; int32 completed_shards=11;
 int32 pending_submissions=12; int32 failed_submissions=13;
}

message PullReference {
 string url=1; string title=2; string content=3; string published_at_text=4;
 string site_name=5; string authority_level=6; string site_category=7;
 string author=8; string author_category=9; string author_identity_type=10;
}
